# Controllers for the real arm. MoveIt uses arm_controller + gripper_controller; the policy bridge uses
# forward_position_controller. They claim the same joints, so only one set is active at a time:
#   ros2 control switch_controllers --deactivate arm_controller gripper_controller \
#     --activate forward_position_controller
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz; one sync read of 6 servos takes ~2 ms

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    forward_position_controller:
      type: position_controllers/JointGroupPositionController

arm_controller:
  ros__parameters:
    joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    # Without goal tolerances a move "succeeds" even when the arm never got there (e.g. driver holding).
    constraints:
      goal_time: 1.0  # s after the trajectory's end to get within tolerance
      stopped_velocity_tolerance: 0.0  # off: velocity is a finite difference of 1-tick steps, too noisy
      shoulder_pan: {goal: 0.05}
      shoulder_lift: {goal: 0.05}
      elbow_flex: {goal: 0.05}
      wrist_flex: {goal: 0.05}
      wrist_roll: {goal: 0.05}

gripper_controller:
  ros__parameters:
    joints: [gripper]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

forward_position_controller:
  ros__parameters:
    # Same order as the policy bridge's joint_names.
    joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper]
